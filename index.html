<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toolbench – AI tools for everyday work</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1F7; --surface:#FFFFFF; --ink:#12182B; --muted:#5B6479;
  --line:#D5DCE8; --accent:#2B3BFF; --accent-ink:#FFFFFF; --soft:#E1E6FF; --err:#B3261E;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0E1322;--surface:#161D33;--ink:#E8ECF7;--muted:#98A2BC;--line:#262F4D;--accent:#7C89FF;--accent-ink:#0E1322;--soft:#232C57;--err:#FF8A80;color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;min-height:100vh}
h1,h2,.brand{font-family:"Bricolage Grotesque",Inter,system-ui,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;padding:18px clamp(16px,4vw,40px);border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:22px;letter-spacing:-.02em}
header span{color:var(--muted);font-size:14px}
.hero{padding:clamp(28px,6vw,64px) clamp(16px,4vw,40px) 12px;max-width:1100px;margin:0 auto}
.hero h1{font-size:clamp(34px,6vw,64px);line-height:1.02;letter-spacing:-.03em;margin:0 0 14px;font-weight:800;max-width:14ch}
.hero p{color:var(--muted);max-width:52ch;margin:0}
main{display:grid;grid-template-columns:240px 1fr;gap:24px;max-width:1100px;margin:28px auto 60px;padding:0 clamp(16px,4vw,40px)}
nav{display:flex;flex-direction:column;gap:6px;align-self:start;position:sticky;top:16px}
nav button{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:1px solid transparent;background:transparent;color:var(--ink);padding:10px 12px;border-radius:10px;cursor:pointer;font:inherit}
nav button b{font-weight:500}
nav button small{color:var(--muted);font-size:13px}
nav button:hover{background:var(--surface)}
nav button[aria-pressed="true"]{background:var(--surface);border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:clamp(16px,3vw,28px)}
.panel h2{margin:0 0 4px;font-size:26px;letter-spacing:-.02em}
.panel .desc{margin:0 0 18px;color:var(--muted)}
label{display:block;font-size:14px;font-weight:500;margin-bottom:6px}
textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
textarea{min-height:150px;resize:vertical}
.row{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-top:14px}
.row>div{flex:1 1 180px}
.count{font-size:13px;color:var(--muted);text-align:right;margin-top:4px}
.run{flex:0 0 auto;border:0;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:500;padding:12px 22px;border-radius:10px;cursor:pointer}
.run:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.out{margin-top:22px;border-top:1px solid var(--line);padding-top:18px}
.out-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:500}
.copy{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.result{white-space:pre-wrap;word-wrap:break-word;line-height:1.65}
.empty{color:var(--muted)}
.error{color:var(--err)}
.dots::after{content:"";animation:d 1s steps(4) infinite}
@keyframes d{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
@media (max-width:760px){
  main{grid-template-columns:1fr}
  nav{flex-direction:row;overflow-x:auto;position:static;padding-bottom:4px}
  nav button{flex:0 0 auto;border-color:var(--line);background:var(--surface)}
  nav button small{display:none}
}
@media (prefers-reduced-motion:reduce){.dots::after{animation:none;content:"..."}}
</style>
</head>
<body>
<header>
  <div class="brand">Toolbench</div>
  <span>Free AI tools</span>
</header>

<section class="hero">
  <h1>Pick a tool. Ask. Get an answer.</h1>
  <p>Nine focused AI assistants for video, writing, study, business, career, code, translation and design.</p>
</section>

<main>
  <nav id="nav" aria-label="AI tools"></nav>

  <section class="panel" aria-live="polite">
    <h2 id="title"></h2>
    <p class="desc" id="desc"></p>

    <label for="prompt">Your request</label>
    <textarea id="prompt" maxlength="6000"></textarea>
    <div class="count"><span id="n">0</span> / 6000</div>

    <div class="row">
      <div>
        <label for="lang">Reply language</label>
        <select id="lang">
          <option>English</option><option>Urdu</option><option>Roman Urdu</option>
          <option>Hindi</option><option>Arabic</option><option>Spanish</option>
          <option>French</option><option>Chinese</option>
        </select>
      </div>
      <button class="run" id="run">Get answer</button>
    </div>

    <div class="out">
      <div class="out-head"><span>Answer</span><button class="copy" id="copy" hidden>Copy</button></div>
      <div class="result empty" id="result">Your answer will appear here.</div>
    </div>
  </section>
</main>

<script>
const API_URL = "/api/ai";

const TOOLS = {
  assistant:{name:"General assistant",sub:"Ask anything",ph:"Ask me anything…"},
  youtube:{name:"YouTube strategist",sub:"Ideas, titles, scripts",ph:"e.g. Give me 10 video ideas for a cooking channel for beginners."},
  writer:{name:"Content writer",sub:"Posts, emails, articles",ph:"e.g. Write a short Instagram caption for my new bakery."},
  student:{name:"Study helper",sub:"Learn any topic",ph:"e.g. Explain photosynthesis simply with an example."},
  business:{name:"Business consultant",sub:"Plans and ideas",ph:"e.g. How do I start an online clothing store with a small budget?"},
  career:{name:"Career coach",sub:"CVs and interviews",ph:"e.g. Help me prepare for a junior web developer interview."},
  developer:{name:"Coding helper",sub:"Write and fix code",ph:"e.g. Write a JavaScript function that removes duplicates from an array."},
  translator:{name:"Translator",sub:"Any language",ph:"Paste the text you want translated…"},
  design:{name:"Design consultant",sub:"Logos, colors, layouts",ph:"e.g. Suggest a color palette and fonts for a fitness brand."}
};

const $ = id => document.getElementById(id);
let tool = "assistant";

function pick(key){
  tool = key;
  const t = TOOLS[key];
  $("title").textContent = t.name;
  $("desc").textContent = t.sub;
  $("prompt").placeholder = t.ph;
  document.querySelectorAll("#nav button").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.key === key));
}

Object.entries(TOOLS).forEach(([key,t]) => {
  const b = document.createElement("button");
  b.dataset.key = key;
  b.innerHTML = "<b></b><small></small>";
  b.firstChild.textContent = t.name;
  b.lastChild.textContent = t.sub;
  b.onclick = () => pick(key);
  $("nav").appendChild(b);
});
pick("assistant");

$("prompt").addEventListener("input", e => $("n").textContent = e.target.value.length);

function show(text, cls){
  const r = $("result");
  r.className = "result " + (cls || "");
  r.textContent = text;
}

$("run").onclick = async () => {
  const prompt = $("prompt").value.trim();
  if(!prompt){ show("Write your request first.", "error"); $("copy").hidden = true; return; }

  const btn = $("run");
  btn.disabled = true;
  $("copy").hidden = true;
  $("result").className = "result empty dots";
  $("result").textContent = "Thinking";

  try{
    const res = await fetch(API_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({prompt, tool, language:$("lang").value})
    });
    const data = await res.json().catch(() => ({}));
    if(!res.ok || data.error){
      show(data.error || "Something went wrong. Try again.", "error");
    }else{
      show(data.text);
      $("copy").hidden = false;
    }
  }catch(e){
    show("Could not reach the server. Check your connection and try again.", "error");
  }finally{
    btn.disabled = false;
  }
};

$("copy").onclick = async () => {
  try{
    await navigator.clipboard.writeText($("result").textContent);
    $("copy").textContent = "Copied";
    setTimeout(() => $("copy").textContent = "Copy", 1500);
  }catch(e){}
};
</script>
</body>
  </html>
